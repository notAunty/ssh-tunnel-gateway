apiVersion: v1
kind: Namespace
metadata:
  name: ssh-gateway-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssh-tunnel-gateway
  namespace: ssh-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ssh-tunnel-gateway-role
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "tlsroutes", "tcproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status", "tlsroutes/status", "tcproutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ssh-tunnel-gateway-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ssh-tunnel-gateway-role
subjects:
  - kind: ServiceAccount
    name: ssh-tunnel-gateway
    namespace: ssh-gateway-system
