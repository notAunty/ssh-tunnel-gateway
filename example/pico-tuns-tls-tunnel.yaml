# Example: Pico.sh tuns.sh SNI / TLS Tunneling Mode (Internal TLS Termination)
#
# Opens an SSH reverse tunnel to tuns.sh with `sni-proxy=true` on port 443.
# tuns.sh routes by SNI without decrypting TLS; our controller terminates TLS
# internally using the `app-example-tls` Secret and forwards plaintext HTTP to
# the ClusterIP backend Service.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pico-tls-gateway
  namespace: default
  annotations:
    ssh-tunnel.io/provider: "pico"
    ssh-tunnel.io/ssh-server: "tuns.sh:22"
    ssh-tunnel.io/ssh-username: "your-pico-username"
    ssh-tunnel.io/tls-tunnel-mode: "true"
    # Automatically defaults to "sni-proxy=true" when provider=pico and tls-tunnel-mode=true
    ssh-tunnel.io/session-command: "sni-proxy=true"
spec:
  gatewayClassName: ssh-tunnel
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "app.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: app-example-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-example-route
  namespace: default
spec:
  parentRefs:
    - name: pico-tls-gateway
  hostnames:
    - "app.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo-svc
          port: 80
