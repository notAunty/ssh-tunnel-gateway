# Example: All 4 Modes (HTTP, HTTPS, TLS Passthrough, TCP) with Wildcard Subdomains
#
# Demonstrates a single Gateway exposing:
#   1. HTTP  (port 80)   -> HTTPRoute for *.example.com
#   2. HTTPS (port 443)  -> Wildcard TLS tunnel (*.example.com), terminated internally
#                           using `wildcard-example-tls` Secret -> HTTPRoute
#   3. TLS   (port 443)  -> Shares the same wildcard port-443 tunnel via SNI peeking;
#                           `db.example.com` passes raw encrypted TLS straight to backend pod
#   4. TCP   (port 5432) -> Raw L4 TCP tunnel -> TCPRoute (e.g. Postgres / Redis)
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wildcard-multi-mode-gw
  namespace: default
  annotations:
    # Switch between: pinggy | pico | localhostrun | openssh
    ssh-tunnel.io/provider: "pico"
    ssh-tunnel.io/ssh-server: "tuns.sh:22"
    ssh-tunnel.io/ssh-username: "your-pico-username"
    ssh-tunnel.io/tls-tunnel-mode: "true"
spec:
  gatewayClassName: ssh-tunnel
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-example-tls
    - name: tls-passthrough
      protocol: TLS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Passthrough
    - name: postgres-tcp
      protocol: TCP
      port: 5432
---
# 1 & 2. HTTP + HTTPS (internal TLS termination) wildcard routing
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-apps
  namespace: default
spec:
  parentRefs:
    - name: wildcard-multi-mode-gw
  hostnames:
    - "app.example.com"
    - "api.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo-svc
          port: 80
---
# 3. TLS Passthrough (SNI-routed raw encrypted TLS straight to backend pod)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: secure-db-tls
  namespace: default
spec:
  parentRefs:
    - name: wildcard-multi-mode-gw
      sectionName: tls-passthrough
  hostnames:
    - "db.example.com"
  rules:
    - backendRefs:
        - name: secure-db-svc
          port: 8443
---
# 4. Raw L4 TCP forwarding
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: postgres-tcp-route
  namespace: default
spec:
  parentRefs:
    - name: wildcard-multi-mode-gw
      sectionName: postgres-tcp
  rules:
    - backendRefs:
        - name: postgres-svc
          port: 5432
